apiVersion: v1
kind: Service
metadata:
  name: {{ include "dast-operator.fullname" . }}-webhook-service
  labels:
    {{- include "dast-operator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 9443
      protocol: TCP
      name: http
    - port: 8081
      targetPort: health
      protocol: TCP
      name: health
  selector:
    {{- include "dast-operator.selectorLabels" . | nindent 4 }}
