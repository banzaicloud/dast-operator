apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "dast-operator.fullname" . }}-test-connection"
  labels:
    {{- include "dast-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['-q', '-O', '-', 'http://{{ include "dast-operator.fullname" . }}-webhook-service:8081/readyz']
  restartPolicy: Never
